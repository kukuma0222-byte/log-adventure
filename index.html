<style>
:root{color-scheme:dark;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:#091325;color:#eff5ff}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{touch-action:none;cursor:pointer;border:1px solid #455574;color:inherit;background:#1b2a43;border-radius:14px;padding:14px 20px;font-weight:700;min-height:56px}button:hover{background:#2b3c58}button:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}button:disabled{opacity:.4;cursor:default}header{padding:20px 3vw 12px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:clamp(24px,2.2vw,38px)}.eyebrow{color:#5ee6cc;letter-spacing:.14em;font-size:14px;margin-bottom:6px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select{border:1px solid #455574;border-radius:12px;padding:14px;background:#1b2a43;color:white;min-height:56px}.overview{padding:8px 3vw 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.steps{display:flex;gap:10px;flex-wrap:wrap}.step{padding:10px 14px;border-radius:100px;background:#15233b;color:#9eadc7}.step.active{background:#5ee6cc;color:#071c22;font-weight:bold}.clock{font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}.mission{margin:0 3vw 20px;border-left:4px solid #5ee6cc;padding:12px 18px;background:#11213a;display:flex;justify-content:space-between;gap:18px;align-items:center}.mission h2{margin:0 0 6px;font-size:23px}.mission p{margin:0;line-height:1.7;color:#bbcae2}.arena{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:0 3vw}.lane{--accent:#5ee6cc;border:1px solid #32435e;border-top:5px solid var(--accent);border-radius:20px;background:#101e34;min-width:0;overflow:hidden}.lane:nth-child(2){--accent:#ffc96b}.lane:nth-child(3){--accent:#a9a2ff}.lanehead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:#16253c}.badge{color:var(--accent);font-size:22px;font-weight:800}.score{font-size:18px}.content{padding:22px;min-height:410px}.progress{height:7px;border-radius:10px;background:#2a3951;margin-bottom:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.qmeta{color:#a8b9d3;font-size:16px}.question{font-size:clamp(23px,2vw,34px);font-weight:800;line-height:1.45;min-height:98px;margin:16px 0}.card{display:block;width:100%;font-size:24px;border-color:var(--accent);background:#1f344f;margin-bottom:16px;user-select:none}.card.selected{outline:3px solid var(--accent)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{font-size:clamp(19px,1.6vw,27px);min-height:76px;padding:12px 6px;user-select:none}.answer.correct{background:#164e43;border-color:#5ee6cc}.answer.wrong{background:#632d3b;border-color:#ff91a7}.feedback{min-height:80px;line-height:1.65;padding-top:16px;font-size:18px;color:#cbd7e9}.feedback.good{color:#76eed5}.next{width:100%;background:var(--accent);color:#0a1730;margin-top:8px}.done{text-align:center;padding:24px 0}.done .seal{font-size:64px;color:var(--accent)}.done h3{font-size:28px}.done p{font-size:20px;line-height:1.7}.footer{margin:20px 3vw;display:flex;justify-content:space-between;align-items:center;gap:14px;color:#a8b9d3;line-height:1.6}.primary{background:#5ee6cc;color:#071c22;border-color:#5ee6cc}.summary{margin:0 3vw 22px;padding:24px;border:1px solid #5ee6cc;border-radius:20px;background:#102e36}.summary h2{margin-top:0}.summary table{width:100%;border-collapse:collapse;font-size:20px}.summary td,.summary th{text-align:left;padding:14px;border-bottom:1px solid #33535c}.notice{color:#ffc96b}.paused .lane{opacity:.5;pointer-events:none}dialog{background:#12223c;color:white;border:1px solid #5ee6cc;border-radius:20px;max-width:650px;padding:28px;line-height:1.8}dialog::backdrop{background:#000b}.ghost{position:fixed;pointer-events:none;z-index:20;padding:16px;background:#5ee6cc;color:#071c22;font-weight:bold;border-radius:12px;transform:translate(-50%,-50%)}[hidden]{display:none!important}@media(min-width:1600px){.content{min-height:480px;padding:28px}.answer{min-height:90px}.feedback{font-size:22px}}@media(max-width:850px){header{align-items:flex-start;flex-direction:column}.overview{align-items:flex-start}.arena{gap:8px;margin:0 12px}.lanehead{padding:12px 8px;flex-direction:column;gap:6px}.content{padding:12px}.answers{grid-template-columns:1fr}.question{font-size:22px}.answer{font-size:19px;min-height:60px}.mission{margin:0 12px 16px}.footer{align-items:flex-start;flex-direction:column}.steps{gap:4px}.step{font-size:14px;padding:8px}.clock{font-size:19px}}@media(max-width:520px){.arena{grid-template-columns:1fr}.content{min-height:0}.answers{grid-template-columns:1fr 1fr}.lanehead{flex-direction:row}.question{min-height:0}.mission{flex-direction:column;align-items:flex-start}}
</style></head><body>
<header><div><div class="eyebrow">COMMON LOG · 三人觸控任務</div><h1>對數探險隊</h1></div><div class="tools"><select id="mode" aria-label="計分模式"><option value="team">全隊合作</option><option value="race">個人競賽</option></select><button id="pause">暫停</button><button id="full">全螢幕</button><button id="help">玩法</button><button id="reset">重新開始</button></div></header>
<div class="overview"><div class="steps" id="steps"></div><div class="clock" id="clock">00:00</div></div>
<section class="mission"><div><h2 id="title"></h2><p id="description"></p></div><strong id="teamScore">全隊 0 分</strong></section>
<section id="summary" class="summary" hidden></section><main class="arena" id="arena"></main>
<div class="footer"><span id="status">每人操作自己的區域，答錯可以重試。計時不影響得分。</span><button id="advance" class="primary" disabled>三人完成後進入下一關</button></div>
<dialog id="helpDialog"><h2>三人一起出發</h2><p>左、中、右各一位同學。前三關每人 4 題，第四關每人 2 題。答對後按自己的「下一題」，完成後等候隊友。</p><p>第一關：先點題目卡再點答案，也能拖曳卡片到答案上。其他關直接點答案。每題第一次答對 10 分；重試後答對 6 分。合作與競賽都須三人完成才能過關。</p><p>老師可暫停、切換計分模式或重新開始。全螢幕也可用 F11。共 42 題，沒有倒數壓力。</p><button id="closeHelp" class="primary">了解，開始探險</button></dialog>
<dialog id="resetDialog"><h2>開始新的一輪？</h2><p>本輪分數與答題紀錄將清除。</p><button id="cancelReset">繼續本輪</button> <button id="confirmReset" class="primary">開始新一輪</button></dialog>
<script>
'use strict';
const stages=[{name:'配對暖身',desc:'把題目卡配到正確的答案。先點卡片再點答案，或直接拖曳。',hint:'log a = x，表示 10 的 x 次方等於 a。'},{name:'數量級電梯',desc:'判斷數值落在哪個範圍，或判斷有幾位數。',hint:'先找到相鄰的整數指數，再轉換成 10 的次方範圍。'},{name:'十倍能量機',desc:'把倍數轉成對數的變化，選出正確結果。',hint:'原數 ×10，對數 +1；原數 ÷10，對數 −1。'},{name:'合作寶箱',desc:'每人解開兩個鎖。三人的鎖全解開，寶箱就開啟！',hint:'先改寫成 10 的次方，再計算指數或比較指數差。'}];
function Q(text,answer,options,why){return {text,answer:String(answer),options:options.map(String),why}}
const bank=[
[
[Q('log 1000 = ?',3,[3,2,-3,100],'1000 = 10³，所以 log 1000 = 3。'),Q('log 0.01 = ?',-2,[-2,2,-1,0.01],'0.01 = 10⁻²，所以 log 0.01 = −2。'),Q('10^(log 22) = ?',22,[22,10,2.2,1],'依定義，10^(log a) = a。'),Q('log 1 = ?',0,[0,1,10,-1],'10⁰ = 1，所以 log 1 = 0。')],
[Q('log 100 = ?',2,[2,3,-2,10],'100 = 10²。'),Q('log 0.001 = ?',-3,[-3,3,-2,0],'0.001 = 10⁻³。'),Q('10^(log 73) = ?',73,[73,7.3,10,3],'指數與常用對數互相對應。'),Q('log 10 = ?',1,[1,0,10,-1],'10¹ = 10。')],
[Q('log 10000 = ?',4,[4,3,-4,1000],'10000 = 10⁴。'),Q('log 0.1 = ?',-1,[-1,1,0,10],'0.1 = 10⁻¹。'),Q('10^(log 0.123) = ?','0.123',['0.123','1.23','123','10'],'10^(log a) = a，對正的小數也成立。'),Q('log 0.000001 = ?',-6,[-6,6,-5,0],'0.000001 = 10⁻⁶。')]
],
[
[Q('log a = 2.34，a 在哪裡？','100 < a < 1000',['100 < a < 1000','10 < a < 100','1000 < a < 10000','0 < a < 1'],'2 < log a < 3，所以 10² < a < 10³。'),Q('log a = 4.2，整數部分幾位？','5 位',['5 位','4 位','3 位','6 位'],'10⁴ < a < 10⁵，整數部分是五位數。'),Q('log a = −2.8，a 在哪裡？','0.001 < a < 0.01',['0.001 < a < 0.01','0.01 < a < 0.1','0.1 < a < 1','1 < a < 10'],'−3 < −2.8 < −2，因此 10⁻³ < a < 10⁻²。'),Q('log a = 0.7，a 在哪裡？','1 < a < 10',['1 < a < 10','0 < a < 1','10 < a < 100','100 < a < 1000'],'0 < 0.7 < 1，所以 10⁰ < a < 10¹。')],
[Q('log a = 3.6，a 在哪裡？','1000 < a < 10000',['1000 < a < 10000','100 < a < 1000','10 < a < 100','10000 < a < 100000'],'3 < log a < 4。'),Q('log a = 5.1，整數部分幾位？','6 位',['6 位','5 位','4 位','7 位'],'10⁵ < a < 10⁶，是六位數。'),Q('log a = −1.4，a 在哪裡？','0.01 < a < 0.1',['0.01 < a < 0.1','0.1 < a < 1','0.001 < a < 0.01','1 < a < 10'],'−2 < log a < −1。'),Q('log a = 1.9，a 在哪裡？','10 < a < 100',['10 < a < 100','1 < a < 10','100 < a < 1000','0 < a < 1'],'1 < log a < 2。')],
[Q('log a = 1.2，a 在哪裡？','10 < a < 100',['10 < a < 100','1 < a < 10','100 < a < 1000','0 < a < 1'],'10¹ < a < 10²。'),Q('log a = 6.3，整數部分幾位？','7 位',['7 位','6 位','5 位','8 位'],'10⁶ < a < 10⁷，是七位數。'),Q('log a = −3.2，a 在哪裡？','0.0001 < a < 0.001',['0.0001 < a < 0.001','0.001 < a < 0.01','0.01 < a < 0.1','0.1 < a < 1'],'−4 < log a < −3。'),Q('log a = −0.6，a 在哪裡？','0.1 < a < 1',['0.1 < a < 1','1 < a < 10','0.01 < a < 0.1','10 < a < 100'],'−1 < log a < 0。')]
],
[
[Q('log a = 3.84，log(100a) = ?','5.84',['5.84','3.86','384','1.84'],'100a = 10² × 10³·⁸⁴ = 10⁵·⁸⁴。'),Q('log a = 2.7，log(a ÷ 10) = ?','1.7',['1.7','2.6','0.27','3.7'],'除以 10，對數減 1。'),Q('log a = 2.7，log b = 1.7。a 是 b 的幾倍？','10 倍',['10 倍','1 倍','100 倍','2 倍'],'a/b = 10^(2.7−1.7) = 10。'),Q('原數 ×1000，對數增加多少？',3,[3,1000,1,10],'1000 = 10³，所以對數增加 3。')],
[Q('log a = 1.25，log(10a) = ?','2.25',['2.25','12.5','1.35','0.25'],'乘以 10，對數增加 1。'),Q('log a = 4.6，log(a ÷ 100) = ?','2.6',['2.6','4.4','0.046','6.6'],'除以 100，對數減 2。'),Q('log a = −4.3，log b = −5.3。a 是 b 的幾倍？','10 倍',['10 倍','0.1 倍','100 倍','1 倍'],'−4.3−(−5.3) = 1，倍數為 10¹。'),Q('對數減少 2，原數變成？','原來的 1/100',['原來的 1/100','原來的 1/2','原來的 100 倍','原來的 1/10'],'指數減 2，原數乘以 10⁻²。')],
[Q('log a = 0.48，log(1000a) = ?','3.48',['3.48','480','0.483','2.48'],'乘以 1000，對數增加 3。'),Q('log a = −1.2，log(a ÷ 10) = ?','−2.2',['−2.2','−0.2','−0.12','−1.3'],'−1.2−1 = −2.2。'),Q('log a = 4.5，log b = 2.5。a 是 b 的幾倍？','100 倍',['100 倍','10 倍','2 倍','1000 倍'],'a/b = 10^(4.5−2.5) = 100。'),Q('對數增加 0.5，原數乘以？','10^0.5',['10^0.5','0.5','5','10'],'倍數為 10 的「對數差」次方，10^0.5 約為 3.162。')]
],
[
[Q('log a = 4.8，log b = 2.5。ab 的整數部分幾位？','8 位',['8 位','7 位','6 位','9 位'],'ab = 10^(4.8+2.5) = 10⁷·³，所以是八位數。'),Q('log E = 4.8 + 1.5M。M = 5 時，log E = ?','12.3',['12.3','9.3','7.5','24'],'4.8 + 1.5 × 5 = 12.3。')],
[Q('log a = 1.2，log b = 1.9。a²b 的整數部分幾位？','5 位',['5 位','4 位','3 位','6 位'],'a²b = 10^(2×1.2+1.9) = 10⁴·³，所以是五位數。'),Q('log E = 4.8 + 1.5M。M = 3 時，log E = ?','9.3',['9.3','12.3','4.5','14.4'],'4.8 + 1.5 × 3 = 9.3。')],
[Q('氫離子濃度 a = 10^(−1.2)，pH = −log a。pH = ?','1.2',['1.2','−1.2','12','0.12'],'log a = −1.2，所以 pH = −(−1.2) = 1.2。'),Q('兩場地震的 log E 分別為 12.3 與 9.3，前者能量是後者的幾倍？','1000 倍',['1000 倍','3 倍','100 倍','10 倍'],'能量倍數為 10^(12.3−9.3) = 10³ = 1000。')]
]
];
let stage=0,players,paused=false,finished=false,elapsed=0;const drags=new Map();let round=0;
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function init(){round++;drags.forEach(d=>d.ghost?.remove());drags.clear();stage=0;elapsed=0;paused=false;finished=false;players=Array.from({length:3},()=>({index:0,score:0,wrong:0,solved:false,selected:false,attempts:0,history:[]}));$('summary').hidden=true;$('pause').textContent='暫停';document.body.classList.remove('paused');$('arena').innerHTML=players.map((_,i)=>`<section class="lane" id="lane${i}" aria-label="學生 ${i+1} 操作區"><div class="lanehead"><span class="badge">探險員 ${['A','B','C'][i]}</span><span class="score" id="score${i}">0 分</span></div><div class="content" id="content${i}"></div></section>`).join('');renderStage();updateClock()}
function renderStage(){ $('steps').innerHTML=stages.map((s,i)=>`<span class="step ${i===stage?'active':''}">${i+1} · ${s.name}</span>`).join('');$('title').textContent=`第 ${stage+1} 關｜${stages[stage].name}`;$('description').textContent=stages[stage].desc;players.forEach((p,i)=>{p.index=0;p.solved=false;p.selected=false;p.attempts=0;renderPlayer(i)});updateGlobal()}
function renderPlayer(i){const p=players[i],qs=bank[stage][i],host=$('content'+i);$('score'+i).textContent=p.score+' 分';if(p.index>=qs.length){host.innerHTML=`<div class="progress"><span style="width:100%"></span></div><div class="done"><div class="seal">✓</div><h3>${stage===3?'兩個鎖都解開了！':'本關完成！'}</h3><p>等候隊友完成<br>可以幫隊友解釋想法</p></div>`;updateGlobal();return}const q=qs[p.index];host.innerHTML=`<div class="progress"><span style="width:${p.index/qs.length*100}%"></span></div><div class="qmeta">${stage===3?'密碼鎖':'任務'} ${p.index+1} / ${qs.length}</div><div class="question">${escapeHTML(q.text)}</div>${stage===0?'<button class="card" data-card="'+i+'">點選或拖曳這張題目卡</button>':''}<div class="answers">${shuffle(q.options).map(o=>`<button class="answer" data-value="${escapeHTML(o)}">${escapeHTML(o)}</button>`).join('')}</div><div class="feedback" id="feedback${i}" role="status">${stage===0?'先點上方卡片，再點正確答案。':'選出正確答案，解釋會在這裡出現。'}</div><button class="next" id="next${i}" hidden>${p.index===qs.length-1?'完成本關':'下一題'}</button>`;host.querySelectorAll('.answer').forEach(btn=>{btn.addEventListener('click',()=>answer(i,btn));btn.addEventListener('pointerup',e=>{if(e.pointerType==='touch'){e.preventDefault();answer(i,btn)}})});$('next'+i).addEventListener('click',()=>{if(paused||!p.solved)return;p.index++;p.solved=false;p.selected=false;p.attempts=0;renderPlayer(i)});const card=host.querySelector('.card');if(card){card.addEventListener('click',()=>{if(paused||p.solved)return;p.selected=true;card.classList.add('selected');$('feedback'+i).textContent='已選取，請點答案。'});card.addEventListener('pointerdown',e=>{if(paused||p.solved)return;card.setPointerCapture(e.pointerId);drags.set(e.pointerId,{i,x:e.clientX,y:e.clientY,card,round,stage,index:p.index,ghost:null})});card.addEventListener('pointermove',e=>{const d=drags.get(e.pointerId);if(!d)return;if(!d.ghost&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>12){d.ghost=document.createElement('div');d.ghost.className='ghost';d.ghost.textContent=q.text;document.body.appendChild(d.ghost)}if(d.ghost){d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px'}});card.addEventListener('pointerup',e=>{const d=drags.get(e.pointerId);if(!d)return;d.ghost?.remove();drags.delete(e.pointerId);if(!paused&&!p.solved&&d.round===round&&d.stage===stage&&d.index===p.index){p.selected=true;card.classList.add('selected');$('feedback'+i).textContent='已選取，請點答案。'}if(d.ghost&&d.round===round&&d.stage===stage&&d.index===p.index){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.answer');if(target&&host.contains(target)){p.selected=true;answer(i,target)}}});card.addEventListener('pointercancel',e=>{drags.get(e.pointerId)?.ghost?.remove();drags.delete(e.pointerId)})}}
function answer(i,btn){const p=players[i];if(paused||p.solved||finished)return;const q=bank[stage][i][p.index];if(stage===0&&!p.selected){$('feedback'+i).textContent='請先點選或拖曳題目卡。';return}const fb=$('feedback'+i);p.attempts++;if(btn.dataset.value===q.answer){p.solved=true;p.score+=p.attempts===1?10:6;p.history.push({stage:stage+1,text:q.text,attempts:p.attempts});btn.classList.add('correct');fb.classList.add('good');fb.textContent='答對了！'+q.why;$('next'+i).hidden=false;$('content'+i).querySelectorAll('.answer').forEach(b=>b.disabled=true);$('score'+i).textContent=p.score+' 分';updateGlobal()}else{p.wrong++;btn.classList.add('wrong');btn.disabled=true;fb.textContent='再想一想：'+stages[stage].hint}}
function updateGlobal(){const total=players.reduce((s,p)=>s+p.score,0);$('teamScore').textContent=$('mode').value==='team'?`全隊 ${total} 分`:`最高 ${Math.max(...players.map(p=>p.score))} 分`;const done=players.filter((p,i)=>p.index>=bank[stage][i].length).length;$('advance').disabled=done<3||paused||finished;$('advance').textContent=stage===3?'三人解鎖，開啟寶箱':'三人完成，進入下一關';$('status').textContent=done===3?'三人完成！請老師按右方按鈕繼續。':`本關已有 ${done} / 3 人完成 · 答錯可以重試，計時不影響得分。`}
function updateClock(){$('clock').textContent=(paused?'已暫停 · ':'')+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0')}
$('advance').addEventListener('click',()=>{if(paused||players.some((p,i)=>p.index<bank[stage][i].length))return;if(stage<3){stage++;renderStage()}else{finished=true;$('advance').disabled=true;$('pause').disabled=true;const max=Math.max(...players.map(p=>p.score));$('summary').hidden=false;$('summary').innerHTML=`<h2>寶箱開啟！全隊完成 42 個任務</h2><p>全隊 ${players.reduce((s,p)=>s+p.score,0)} / 420 分 · 用時 ${$('clock').textContent}${$('mode').value==='race'?' · 最高分：'+players.map((p,i)=>p.score===max?['A','B','C'][i]:null).filter(Boolean).join('、'):''}</p><table><thead><tr><th>探險員</th><th>得分</th><th>首次答對</th><th>重試次數</th></tr></thead><tbody>${players.map((p,i)=>`<tr><td>${['A','B','C'][i]}</td><td>${p.score} / 140</td><td>${p.history.filter(h=>h.attempts===1).length} / 14</td><td>${p.wrong}</td></tr>`).join('')}</tbody></table><p>討論：對數差為 3，為什麼原數的倍數是 1000？</p>`;$('status').textContent='可以按「重新開始」，換下一組同學。';$('summary').scrollIntoView({behavior:'smooth',block:'start'})}});
$('pause').addEventListener('click',()=>{if(finished)return;paused=!paused;document.body.classList.toggle('paused',paused);$('pause').textContent=paused?'繼續':'暫停';updateGlobal();updateClock()});$('mode').addEventListener('change',updateGlobal);$('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('status').textContent='此瀏覽器未允許全螢幕，請用 F11 或瀏覽器選單。'}});$('help').addEventListener('click',()=>$('helpDialog').showModal());$('closeHelp').addEventListener('click',()=>$('helpDialog').close());$('reset').addEventListener('click',()=>$('resetDialog').showModal());$('cancelReset').addEventListener('click',()=>$('resetDialog').close());$('confirmReset').addEventListener('click',()=>{$('resetDialog').close();$('pause').disabled=false;init()});setInterval(()=>{if(!paused&&!finished&&!document.querySelector('dialog[open]')){elapsed++;updateClock()}},1000);init();
</script></body></html>
